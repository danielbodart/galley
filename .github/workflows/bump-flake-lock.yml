# All of danielbodart's flakes move their locks in one window a week, Sunday
# 21:23 UTC, and the NixOS config that takes them follows two hours later, so
# they all land on the same nixpkgs: a security fix reaches every machine
# within the week, a machine carries one nixpkgs rather than one per flake,
# and danielbodart.cachix.org already holds what the config asks for.
#
# The new lock is committed only if `nix flake check` -- what CI's check job
# runs -- passes with it. A push with GITHUB_TOKEN starts no workflow, so this
# starts CI on the bumped commit itself, and that releases it as any push to
# trunk does.
name: Bump the flake's inputs
on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: flake-lock
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pushes what the check builds. Without the secret it only substitutes.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update the inputs
        id: update
        run: |
          nix flake update 2>&1 | tee update.log
          git diff --quiet flake.lock && { echo "Nothing moved."; exit 0; }
          moved=$(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2 | paste -sd, - | sed 's/,/, /g')
          echo "moved=${moved:-flake.lock}" >>"$GITHUB_OUTPUT"

      - name: nix flake check with the new lock
        if: steps.update.outputs.moved
        run: nix flake check --print-build-logs

      - name: Commit and push the lock, and run CI on it
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Bump the flake's inputs: $MOVED" flake.lock
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk
          gh workflow run ci.yml --ref trunk
