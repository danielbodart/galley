# The toolchain, pinned to the patch, for the release tarballs, CI's fast
# checks and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand, with go_1_NN in flake.nix, so the tarballs
# and the Nix package are built by the same Go.
[tools]
go = "1.27.3"
shellcheck = "0.11.0"
cosign = "3.1.4"

# What the release tarballs and the Go packages other modules import are made
# of. A change to any of these since the last release tag is released (see
# release-due); the workflows, docs, flake.nix, flake.lock and nix/ are not.
# The units and the desktop file the tarballs ship are in packaging/, which
# the flake's package takes them from too.
[env]
RELEASE_PATHS = "cmd internal services wire daemon packaging scripts/dist.sh go.mod go.sum mise.toml VERSION"

[tasks.check]
description = "gofmt, vet, the client's tests and shellcheck"
depends = ["lint", "test", "shellcheck"]

[tasks.lint]
description = "gofmt and vet"
run = '''
unformatted=$(gofmt -l .)
[ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted" >&2; exit 1; }
CGO_ENABLED=0 go vet ./...
'''

[tasks.test]
description = "The client's tests (the end-to-end tests run in nix flake check, on broadway)"
run = "CGO_ENABLED=0 go test -count=1 ./..."

[tasks.shellcheck]
description = "shellcheck the scripts and the installer"
run = "shellcheck scripts/*.sh packaging/install.sh packaging/galley-daemon"

[tasks.build]
description = "The client, static, for this machine, into dist/"
run = "CGO_ENABLED=0 go build -trimpath -o dist/galley ./cmd/galley"

# Only the tarballs, no loose per-architecture binary beside them as other
# tools ship: the client alone is useless without the window it asks, which
# is JavaScript, its units and the desktop file, all of which the tarball and
# its installer bring (the README's Channels says so).
[tasks.dist]
description = "The release tarballs, x86_64 and aarch64, and SHA256SUMS, into dist/"
run = '''
rm -rf dist
version=$(scripts/version.sh)
for arch in x86_64 aarch64; do scripts/dist.sh "$version" "$arch" dist; done
(cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
'''

[tasks.dist-check]
description = "This machine's tarball, as dist made it, installed into a prefix, its units verified, and uninstalled"
run = "scripts/dist-check.sh"

[tasks.release-due]
description = "Print true and succeed if anything in RELEASE_PATHS changed since the last release tag (or there is none), else print false and fail"
run = '''
set -f
last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || { echo true; exit 0; }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; exit 1; fi
'''
